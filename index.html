<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>经典推箱子 - Microban 155关</title>
  <!-- 引入现代字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- 头部栏 -->
    <header class="game-header">
      <div class="brand">
        <h1 data-i18n="brand_title">推箱子</h1>
        <span id="set-badge" class="badge">Warmup</span>
        <div class="select-container select-lang">
          <select id="lang-select">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <div class="select-container select-theme">
          <select id="theme-select">
            <option value="classic" data-i18n="theme_classic">经典复古</option>
            <option value="cyber" data-i18n="theme_cyber">赛博霓虹</option>
            <option value="wood" data-i18n="theme_wood">森林木箱</option>
          </select>
        </div>
      </div>
      <div class="level-selector-wrapper">
        <div class="select-container select-set">
          <select id="set-select">
            <option value="Warmup">新手教学 (5关 - 极易)</option>
            <option value="Simplified">宇宙简化版 (40关 - 极简)</option>
            <option value="Minicosmos">Minicosmos (40关 - 简单)</option>
            <option value="Microban">Microban I (155关 - 经典)</option>
          </select>
        </div>
        <button id="prev-level-btn" class="btn btn-icon" data-i18n-title="prev_level" title="上一关">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="select-container select-level">
          <select id="level-select"></select>
        </div>
        <button id="next-level-btn" class="btn btn-icon" data-i18n-title="next_level" title="下一关">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>
    </header>

    <!-- 主体区域 -->
    <main class="game-main">
      <!-- 侧边栏/数据面板 -->
      <aside class="sidebar-panel">
        <div class="level-title-card">
          <h2 id="level-title">加载中...</h2>
          <p class="author-tag">David W. Skinner</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label" data-i18n="step_count">移动步数</span>
            <span id="steps-count" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label" data-i18n="push_count">推送次数</span>
            <span id="pushes-count" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label" data-i18n="time_elapsed">已用时间</span>
            <span id="timer-val" class="stat-value">00:00</span>
          </div>
        </div>

        <div class="best-scores-panel">
          <h3 data-i18n="best_record">本关最佳记录</h3>
          <div class="best-row">
            <span><span data-i18n="best_steps">步数:</span> <strong id="best-steps">-</strong></span>
            <span><span data-i18n="best_pushes">推送:</span> <strong id="best-pushes">-</strong></span>
            <span><span data-i18n="best_time">时间:</span> <strong id="best-time">-</strong></span>
          </div>
        </div>

        <!-- 电脑按键与提示面板 -->
        <div class="control-panel">
          <div class="control-row">
            <button id="undo-btn" class="btn btn-primary btn-flex" data-i18n-title="undo" title="撤销一步 (Key: Z)">
              <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
              <span data-i18n="undo">撤销 (Z)</span>
            </button>
            <button id="redo-btn" class="btn btn-primary btn-flex" data-i18n-title="redo" title="重做一步 (Key: Y)" disabled>
              <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
              <span data-i18n="redo">重做 (Y)</span>
            </button>
          </div>
          <div class="control-row">
            <button id="restart-btn" class="btn btn-secondary btn-flex" data-i18n-title="reset" title="重新开始 (Key: R)">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              <span data-i18n="reset">重置 (R)</span>
            </button>
            <button id="audio-toggle-btn" class="btn btn-secondary btn-flex" data-i18n-title="sound" title="静音开关 (Key: M)">
              <svg id="audio-icon-unmuted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="audio-icon-muted" viewBox="0 0 24 24" class="hidden"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              <span data-i18n="sound">音效 (M)</span>
            </button>
          </div>
        </div>

        <div class="instructions-panel">
          <h3 data-i18n="instructions_title">操作提示</h3>
          <ul class="help-list">
            <li><span class="key-badge">↑</span> <span class="key-badge">↓</span> <span class="key-badge">←</span> <span class="key-badge">→</span><span data-i18n="or">或</span><span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> <span data-i18n="inst_keys">移动角色</span></li>
            <li data-i18n="inst_goal">推箱子到红点上。所有箱子归位即可过关</li>
            <li data-i18n="inst_mobile" data-i18n-html="true">移动端支持屏幕<strong>滑动(Swipe)</strong>操作，或使用下方的虚拟方向键</li>
          </ul>
        </div>
      </aside>

      <!-- 游戏画板容器 -->
      <section class="game-board-container">
        <div id="game-board">
          <!-- 游戏画面将通过 JS 动态生成 -->
        </div>

        <!-- 移动端虚拟方向盘 (默认小屏幕显示，大屏幕隐藏) -->
        <div class="mobile-dpad">
          <div class="dpad-row">
            <button class="dpad-btn dpad-up" data-dir="up">
              <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
          </div>
          <div class="dpad-row">
            <button class="dpad-btn dpad-left" data-dir="left">
              <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
            </button>
            <div class="dpad-center">
              <button id="mobile-undo-btn" class="dpad-center-btn" data-i18n-title="undo" title="撤销">
                <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
              </button>
            </div>
            <button class="dpad-btn dpad-right" data-dir="right">
              <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            </button>
          </div>
          <div class="dpad-row">
            <button class="dpad-btn dpad-down" data-dir="down">
              <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- 关卡完成弹出框 -->
    <div id="victory-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="victory-icon">🎉</div>
          <h2 data-i18n="victory_title">关卡完成！</h2>
          <p id="victory-level-name">Level 1</p>
        </div>
        <div class="modal-body">
          <div class="victory-stats">
            <div class="v-stat-card">
              <span class="v-stat-label" data-i18n="victory_steps">所用步数</span>
              <span id="victory-steps" class="v-stat-value">0</span>
              <span id="victory-steps-badge" class="v-badge hidden" data-i18n="best_badge">最佳!</span>
            </div>
            <div class="v-stat-card">
              <span class="v-stat-label" data-i18n="victory_pushes">推送次数</span>
              <span id="victory-pushes" class="v-stat-value">0</span>
              <span id="victory-pushes-badge" class="v-badge hidden" data-i18n="best_badge">最佳!</span>
            </div>
            <div class="v-stat-card">
              <span class="v-stat-label" data-i18n="victory_time">所用时间</span>
              <span id="victory-time" class="v-stat-value">00:00</span>
              <span id="victory-time-badge" class="v-badge hidden" data-i18n="best_badge">最佳!</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="modal-replay-btn" class="btn btn-secondary btn-large" data-i18n="replay">重玩</button>
          <button id="modal-next-btn" class="btn btn-success btn-large" data-i18n="next_level_btn">下一关</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入游戏关卡与主逻辑 -->
  <script src="levels.js?v=1.0.4"></script>
  <script src="translations.js?v=1.0.4"></script>
  <script src="audio.js?v=1.0.4"></script>
  <script src="app_core.js?v=1.0.4"></script>
  <script src="app_renderer.js?v=1.0.4"></script>
  <script src="app_ui.js?v=1.0.4"></script>
</body>
</html>
